aid: isono-health
name: Isono Health
description: 'iSono Health is a Sunnyvale, California medical device company behind
  ATUSA, described as the first AI-driven portable and automated 3D breast ultrasound
  scanner. ATUSA performs fully automated whole-breast imaging in about two minutes
  per breast without a trained sonographer, pairing a 3D ultrasound scanner and wearable
  accessory with a Windows desktop/tablet application and HIPAA-compliant cloud storage
  for real-time 2D and 3D visualization, lesion localization, and remote monitoring.
  The system is FDA 510(k) cleared and targets more accessible point-of-care breast
  cancer screening and monitoring. iSono Health is a Y Combinator-backed company. No
  public developer API, SDK, or documentation surface is currently published.'
